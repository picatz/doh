name: "Test"

on:
  # TODO: move to "main" branch
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"

permissions:
  contents: "read"

jobs:
  run:
    name: "Go (${{ matrix.go-version || 'go.mod' }})"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        # The empty entry uses the minimum version from go.mod.
        go-version: ["", "stable"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: "Setup Go"
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "${{ matrix.go-version }}"
        go-version-file: "${{ matrix.go-version == '' && 'go.mod' || '' }}"

    - name: "Check formatting"
      run: |
        test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }

    - name: "Vet"
      run: |
        go vet ./...

    - name: "Build"
      run: |
        go build -v ./...

    - name: "Test"
      # Live DoH resolver tests are opt-in (DOH_LIVE_TESTS=1) since public
      # resolvers are not reliably reachable from CI runners.
      run: |
        go test -race -v ./...
