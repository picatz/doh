name: "Release"

# Pushing a version tag, such as v1.2.3, builds doh for every platform,
# attests where each file came from, and publishes them as a release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: "read"

jobs:
  release:
    name: "Build, attest, and publish"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "write"      # create the release
      id-token: "write"      # sign attestations with the workflow's identity
      attestations: "write" # store attestations
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: "Setup Go"
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: "go.mod"
        cache: false

    - name: "Test"
      run: |
        go vet ./...
        go test -race ./...

    - name: "Build"
      run: |
        ./scripts/build-release.sh "${GITHUB_REF_NAME}"

    # SLSA build provenance, signed with Sigstore: proof that each file was
    # built from this commit by this workflow. Verify with
    # gh attestation verify <file> --repo picatz/doh
    - name: "Attest"
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: "dist/*"

    - name: "Publish"
      env:
        GH_TOKEN: "${{ github.token }}"
      run: |
        gh release create "${GITHUB_REF_NAME}" dist/* \
          --repo "${GITHUB_REPOSITORY}" \
          --title "${GITHUB_REF_NAME}" \
          --generate-notes \
          --verify-tag
